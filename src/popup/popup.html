    hr {

      -webkit-text-fill-color: transparent;
      font-size: 18px;
    }
    
    .contributor-table {
      width: 100%;
      margin-top: 24px;
      border-collapse: collapse;
      font-size: 14px;
    }
    
    .contributor-table th {
      padding: 6px 2px;
      background: #f5f5f5;
      border: 1px solid #ddd;
      text-align: center;
      font-weight: bold;
      color: #222;
    }
    
    .contributor-table td {
      padding: 5px 2px;
      border: 1px solid #eee;
      text-align: center;
      word-break: break-all;
      color: #222;
      max-width: 120px;
    }
    
    .contributor-table a {
      color: #3366cc;
      text-decoration: none;
    }
    
    .contributor-table a:hover {
      text-decoration: underline;
    }
    
    .version {
      font-size: 12px;
      color: #6b7280;
      text-align: center;
      margin-top: 20px;
